<div class="dashboard-container">

  <div class="dashboard-header">
    <h1>📊 Panel de Control</h1>
    <p class="subtitle">Bienvenido al sistema de registro de estudiantes</p>
  </div>

  <div class="stats-grid">

    <!-- Card: Total Estudiantes -->
    <div class="stat-card card-blue">
      <div class="stat-icon">
        <i class="fas fa-user-graduate"></i>
      </div>
      <div class="stat-content">
        <h3>{{ totalEstudiantes }}</h3>
        <p>Estudiantes Registrados</p>
      </div>
    </div>

    <!-- Card: Total Cursos -->
    <div class="stat-card card-green">
      <div class="stat-icon">
        <i class="fas fa-book"></i>
      </div>
      <div class="stat-content">
        <h3>{{ totalCursos }}</h3>
        <p>Cursos Disponibles</p>
      </div>
    </div>

    <!-- Card: Promedio Edad -->
    <div class="stat-card card-orange">
      <div class="stat-icon">
        <i class="fas fa-chart-line"></i>
      </div>
      <div class="stat-content">
        <h3>{{ promedioEdad }}</h3>
        <p>Edad Promedio</p>
      </div>
    </div>

    <!-- Card: Grados Activos -->
    <div class="stat-card card-purple">
      <div class="stat-icon">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <div class="stat-content">
        <h3>{{ gradosUnicos }}</h3>
        <p>Grados Activos</p>
      </div>
    </div>

  </div>

  <!-- Quick Actions -->
  <div class="quick-actions">
    <h2>Accesos Rápidos</h2>
    <div class="actions-grid">

      <button class="action-btn btn-primary" routerLink="/estudiantes">
        <i class="fas fa-users"></i>
        <span>Ver Estudiantes</span>
      </button>

      <button class="action-btn btn-success" routerLink="/cursos/catalogo">
        <i class="fas fa-book-open"></i>
        <span>Ver Catálogo de Cursos</span>
      </button>

      <button class="action-btn btn-info" (click)="descargarReporte()">
        <i class="fas fa-file-download"></i>
        <span>Descargar Reporte</span>
      </button>

    </div>
  </div>

</div>
