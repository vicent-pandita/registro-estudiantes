<div class="container mt-4">

  <h2 class="mb-3">Estudiantes</h2>

  <div class="d-flex mb-3">
    <input [(ngModel)]="filtro" type="text" placeholder="Buscar por nombre, apellido, código o DNI..."
      class="form-control me-2" style="max-width: 400px;">

    <button (click)="abrirModal()" class="btn btn-primary me-2">
      Nuevo
    </button>

    <button (click)="descargar()" class="btn btn-success">
      Descargar Lista
    </button>
  </div>

  <div class="table-container">
    <table class="excel-table">
      <thead>
        <tr>
          <th>Código</th>
          <th>DNI</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Edad</th>
          <th>Grado</th>
          <th>Curso</th>
          <th></th>
        </tr>
      </thead>

      <tbody>

        <!-- Si no encuentra datos -->
        <tr *ngIf="filtrar().length === 0">
          <td colspan="8" class="text-center text-muted py-3">
            No se encontraron resultados.
          </td>
        </tr>

        <!-- Filas con directiva y pipes -->
        <tr *ngFor="let e of filtrar()" appResaltar color="lightyellow">

          <td><strong>{{ e.codigo || 'N/A' }}</strong></td>
          <td>{{ e.dni || '-' }}</td>
          <td>{{ e.nombre | capitalizar }}</td>
          <td>{{ e.apellido | capitalizar }}</td>
          <td>{{ e.edad }}</td>
          <td>{{ e.grado }}</td>
          <td>{{ e.curso }}</td>

          <td>
            <div class="action-icons">
              <i class="fas fa-pencil-alt icon-edit" (click)="editar(e.id!)" title="Editar"></i>
              <i class="fas fa-trash-alt icon-delete" (click)="eliminar(e.id!)" title="Eliminar"></i>
            </div>
          </td>
        </tr>

      </tbody>
    </table>
  </div>

  <!-- 👇 MODAL COMPONENT -->
  <app-estudiante-modal (cerrado)="ngOnInit()"></app-estudiante-modal>

</div>
