<div class="catalogo-container">

    <div class="catalogo-header">
        <h1>📚 Cursos Oficiales del Sistema Educativo Peruano</h1>
        <p class="subtitle">Catálogo completo de cursos por nivel educativo</p>
    </div>

    <!-- Tabs para Primaria / Secundaria -->
    <div class="tabs">
        <button class="tab-btn" [class.active]="nivelActivo === 'primaria'" (click)="nivelActivo = 'primaria'">
            <i class="fas fa-child"></i>
            Educación Primaria
        </button>
        <button class="tab-btn" [class.active]="nivelActivo === 'secundaria'" (click)="nivelActivo = 'secundaria'">
            <i class="fas fa-user-graduate"></i>
            Educación Secundaria
        </button>
    </div>

    <!-- Cursos de Primaria -->
    <div class="nivel-educativo" *ngIf="nivelActivo === 'primaria'">
        <h3 class="nivel-titulo primaria">
            <i class="fas fa-child"></i>
            Educación Primaria
        </h3>
        <div class="cursos-grid">
            <div class="curso-item" *ngFor="let curso of cursosOficiales.primaria">
                <i class="fas fa-book-open"></i>
                <span>{{ curso }}</span>
            </div>
        </div>
    </div>

    <!-- Cursos de Secundaria -->
    <div class="nivel-educativo" *ngIf="nivelActivo === 'secundaria'">
        <h3 class="nivel-titulo secundaria">
            <i class="fas fa-user-graduate"></i>
            Educación Secundaria
        </h3>
        <div class="cursos-grid">
            <div class="curso-item" *ngFor="let curso of cursosOficiales.secundaria">
                <i class="fas fa-book-open"></i>
                <span>{{ curso }}</span>
            </div>
        </div>
    </div>

</div>
