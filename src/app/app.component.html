<ng-container *ngIf="(authService.user$ | async) as user; else loginOnly">
  <!-- Usuario autenticado → mostrar navbar -->
  <app-navbar></app-navbar>
  <div class="container mt-4">
    <router-outlet></router-outlet>
  </div>
</ng-container>

<!-- Usuario NO autenticado → solo login/registro -->
<ng-template #loginOnly>
  <router-outlet></router-outlet>
</ng-template>
